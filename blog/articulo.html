<script src="../assets/vendor/lenis.min.js"></script>

<script>
(function () {
  const { icon, esc, toast, reduce, hasGsap } = window.Site;
  const root = document.getElementById('article');
  const slug = new URLSearchParams(location.search).get('slug');

  function notFound() {
    document.title = 'Artículo no encontrado · José María Navarro';
    root.innerHTML = `<header class="page-head"><div class="wrap"><h1 class="display">Esta casilla está vacía</h1>
      <p class="lead">No encuentro ese artículo. Puede que se haya movido o que el enlace esté incompleto.</p>
      <p style="margin-top:24px"><a class="btn" href="./">Ver todos los artículos ${icon('arrow-right', 'icon icon--go')}</a></p></div></header>`;
  }
  if (!slug) return notFound();

  Promise.all([Blog.getPost(slug), Blog.listPosts()]).then(([p, all]) => {
    if (!p || (p.status !== 'published' && !Blog.live)) return notFound();
    document.title = `${p.title} · José María Navarro`;
    document.querySelector('meta[name="description"]').setAttribute('content', p.excerpt || p.title);
    const i = all.findIndex((x) => x.slug === p.slug);
    const next = all[i + 1] || all[0];
    const body = Blog.sanitize(Blog.fixPaths(p.content_html));
    root.innerHTML = `
      <header class="article-head">
        <div class="wrap">
          <a class="back" href="./">${icon('arrow-left')} Blog</a>
          <h1>${esc(p.title)}</h1>
          <div class="meta-line"><span>${icon('calendar')} ${esc(Blog.formatDate(p))}</span><span>${icon('clock')} ${Blog.readingMinutes(p.content_html)} min de lectura</span></div>
          ${p.excerpt ? `<p class="excerpt">${esc(p.excerpt)}</p>` : '<div style="height:30px"></div>'}
        </div>
      </header>
      ${p.cover_url ? `<div class="cover-band"><div class="article-cover"><img src="${esc(Blog.fixUrl(p.cover_url))}" alt=""></div></div>` : ''}
      <div class="article-body">
        <div class="prose" id="prose">${body}</div>
        <div class="article-end">
          <button class="btn btn--ghost" type="button" id="share">${icon('link')} Copiar enlace</button>
          ${next && next.slug !== p.slug ? `<a class="btn" href="articulo.html?slug=${encodeURIComponent(next.slug)}">Siguiente artículo ${icon('arrow-right', 'icon icon--go')}</a>` : ''}
        </div>
      </div>`;
    document.getElementById('share').addEventListener('click', async () => {
      try {
        if (navigator.share) await navigator.share({ title: p.title, url: location.href });
        else { await navigator.clipboard.writeText(location.href); toast('Enlace copiado'); }
      } catch (e) { /* cancelado */ }
    });
    document.querySelectorAll('#prose a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
    if (hasGsap) {
      ScrollTrigger.refresh();
      gsap.to('#progress', { scaleX: 1, ease: 'none', scrollTrigger: { trigger: '#prose', start: 'top 70%', end: 'bottom 80%', scrub: true } });
      if (!reduce) gsap.from('.article-head h1, .article-head .meta-line, .article-head .excerpt, .article-cover img', { y: 40, opacity: 0, duration: 1.1, ease: 'expo.out', stagger: 0.08 });
    }
  }).catch(notFound);
})();
</script>
